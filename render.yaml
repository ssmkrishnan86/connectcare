services:
  - type: web
    name: connectcare-app
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: ASPNETCORE_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: connectcare-db
          property: connectionString

databases:
  - name: connectcare-db
    plan: free
    region: oregon
    databaseName: ConnectCare
    user: postgres
